name: Domix CI / Production Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-and-build:
    name: Build & Verify Apps
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [admin-app, cliente-app, repartidor-app]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ matrix.app }}/package.json'

      - name: Install Dependencies
        run: |
          cd ${{ matrix.app }}
          npm ci || npm install

      - name: Verify Next.js Build
        run: |
          cd ${{ matrix.app }}
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://pwgofasontumxgzahuph.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy_anon_key_for_ci_build' }}
